<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benítez Despensas | Monitor de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="container">
        <section class="page-heading">
            <h1>Monitor de Inventario y Stock</h1>
            <p>Control centralizado de productos y estado del inventario.</p>
        </section>

        <section id="stock-alerts" class="alerts" aria-live="polite"></section>

        <section class="toolbar">
            <div class="search-box">
                <label for="search-input">Buscar producto</label>
                <input id="search-input" type="search" placeholder="Nombre, proveedor o categoría...">
            </div>
            <div class="toolbar-actions">
                <label for="threshold-input">Umbral crítico</label>
                <input id="threshold-input" type="number" min="0" value="10">
                <button id="apply-threshold" class="btn btn-primary">Aplicar</button>
                <a class="btn btn-secondary" href="listado_box.html">Vista Box</a>
                <a class="btn btn-secondary" href="comprar.html" data-requiere-sesion hidden>Comprar</a>
            </div>
        </section>

        <form id="restock-form" class="panel form-panel" hidden>
            <div class="panel-header">
                <div>
                    <h2>Reponer stock</h2>
                    <span class="muted">Registrá mercadería recibida: se suma al inventario.</span>
                </div>
            </div>
            <div class="form-grid">
                <div class="field">
                    <label for="restock-product">Producto</label>
                    <select id="restock-product" required></select>
                </div>
                <div class="field">
                    <label for="restock-quantity">Cantidad a agregar</label>
                    <input id="restock-quantity" type="number" min="1" step="1" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Reponer</button>
            </div>
            <div id="restock-result" class="result-message" aria-live="polite"></div>
        </form>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h2>Inventario actual</h2>
                    <span id="inventory-counter" class="muted"></span>
                </div>
                <a class="btn btn-primary" href="listado_tabla.html">Ver listado completo</a>
            </div>
            <div id="inventory-table" class="table-wrapper"></div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/app.js"></script>
</body>
</html>
